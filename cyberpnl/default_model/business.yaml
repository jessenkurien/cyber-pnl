# Business profile — owned by Finance. If the CFO can't defend a number here, it doesn't go in.
organization: "Example SaaS Inc. (template — replace)"
template: true
owner: "Finance (template role)"
source: business-profile-template
fiscal_year: 2026
annual_revenue: 180000000        # all monetary inputs use the currency declared below
ebitda: 27000000
employees: 900
currency: USD
security_spend_annual: 5400000   # 3% of revenue: people, tools, services (for the P&L ratio)
regimes: [GDPR, CCPA, "SOC 2", "PCI DSS (SAQ-A)"]

