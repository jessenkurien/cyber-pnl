  - {id: customer-portal, name: "Customer portal & support", revenue_per_hour: 1500,  criticality: high,        owner: "VP Customer Success", source: business-impact-analysis-template}
  - {id: erp,             name: "ERP / finance systems",     revenue_per_hour: 500,   criticality: crown_jewel, owner: "CFO", source: business-impact-analysis-template}
  - {id: corp-it,         name: "Corporate IT & email",      revenue_per_hour: 250,   criticality: standard,    owner: "IT Director", source: business-impact-analysis-template}
