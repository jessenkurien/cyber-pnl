statement: >
  The Board accepts cyber loss up to 5% of annual revenue in a 1-in-20 year and expects
  management to keep the expected annual loss below 1.5% of revenue. Breaches of either are
  reported to the Audit & Risk Committee at the next meeting with a treatment plan.
